name: Listingen CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/listingen-marketplace-foundation]

permissions:
  contents: read

concurrency:
  group: listingen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: "bunx eslint . --rule 'prettier/prettier: off'"

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
